repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

-   repo: local
    hooks:
    -   id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]

-   repo: local
    hooks:
    -   id: pytest
        name: pytest
        entry: uv run pytest --ignore=tests/test_detectors/test_integration.py --ignore=tests/test_detectors/test_attack_effectiveness
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
